name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build && git diff --exit-code dist
